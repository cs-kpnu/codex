version: "3.8"
services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${WIKI_PASSWORD}
      POSTGRES_USER: ${WIKI_AND_DB_USERNAME}
    logging:
      driver: "none"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./wiki_backup.sql:/docker-entrypoint-initdb.d/init.sql
  wiki:
    image: requarks/wiki:2
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${WIKI_AND_DB_USERNAME}
      DB_PASS: ${WIKI_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3000:3000"
    volumes:
      - wiki-storage:/wiki/data
    restart: unless-stopped

volumes:
  db-data:
  wiki-storage: